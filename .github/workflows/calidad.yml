# Nombre que aparece en la pestana Actions de GitHub
name: calidad

# CUANDO se ejecuta
on:
  push:
    branches: [entrega-3-infra, practica-sonar]   # en cada push a estas ramas
  workflow_dispatch:              # y con un boton "Run workflow" para lanzarlo a mano

# QUE se ejecuta
jobs:
  pruebas:                        # nombre interno del trabajo
    runs-on: ubuntu-latest        # en que maquina: un Linux limpio que presta GitHub
    steps:
      # 1. La maquina arranca vacia: primero descarga el codigo del repo.
      #    fetch-depth: 0 trae TODO el historial de git (por defecto trae solo
      #    el ultimo commit); SonarQube lo usa para saber que codigo es nuevo.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Instala Go, en la version que dice go.mod
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 3. Lo mismo que corriste a mano en el paso 6
      - name: Pruebas con cobertura
        run: go test -coverprofile=coverage.out ./...

      # 4. El mismo escaner que corriste a mano, ahora contra SonarQube Cloud.
      #    Va en el MISMO job que go test para encontrar coverage.out.
      - name: Analisis SonarQube
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
