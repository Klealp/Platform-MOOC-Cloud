# =====================================================================
# Analisis de calidad con SonarQube (Entrega 3). Lo ejecuta el pipeline
# .github/workflows/calidad.yml en cada push; ver docs/entrega3/guia-sonarqube.md.
# =====================================================================

# Proyecto en SonarQube Cloud. La organizacion y la llave se crean al
# importar el repositorio en sonarcloud.io: si alla quedaron distintas,
# cambiarlas aqui.
sonar.organization=klealp
sonar.projectKey=Klealp_Platform-MOOC-Cloud
sonar.projectName=Platform MOOC Cloud

sonar.sourceEncoding=UTF-8
# Aqui deja el escaner report-task.txt, que lee .github/scripts/sonar-umbrales.sh.
sonar.working.directory=.scannerwork

# --- Alcance: TODO el codigo de la aplicacion -------------------------
# El enunciado pide medir API, workers y frontend completos, no solo el
# codigo nuevo. Se incluyen tambien los Dockerfile (forman parte de lo que
# se despliega).
sonar.sources=cmd,internal,frontend/src,frontend/next.config.ts,Dockerfile.api,Dockerfile.worker,Dockerfile.web,Dockerfile.queue-metrics

# Las pruebas se analizan como pruebas, no como codigo fuente.
sonar.tests=cmd,internal
sonar.test.inclusions=**/*_test.go

# --- Exclusiones (cada una justificada en docs/entrega3/guia-sonarqube.md)
#   *_test.go      ya se analizan como pruebas (sonar.tests)
#   schema.d.ts    generado por openapi-typescript desde internal/openapi/
#                  openapi.yaml (npm run gen:api); no se edita a mano
# Fuera de sonar.sources, y por tanto no analizado:
#   capacity-planning/  herramientas y scripts de pruebas de carga; no se
#                       despliegan ni forman parte del producto
#   deploy/, docs/      scripts de shell y configuracion (SonarQube Cloud no
#                       analiza shell)
sonar.exclusions=**/*_test.go,frontend/src/lib/api/schema.d.ts

# --- Cobertura ---------------------------------------------------------
# go test -coverprofile=coverage.out ./... (lo genera el pipeline). El
# frontend no tiene pruebas automatizadas todavia: queda como deuda.
sonar.go.coverage.reportPaths=coverage.out
