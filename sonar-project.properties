# A que proyecto del servidor pertenece el analisis
sonar.projectKey=mooc-practica.

# Que carpetas y archivos son la aplicacion (separados por coma).
# Los Dockerfile entran porque definen las imagenes que se despliegan.
sonar.sources=cmd,internal,frontend/src,Dockerfile.api,Dockerfile.worker,Dockerfile.web,Dockerfile.queue-metrics

# Los *_test.go no son codigo de la aplicacion...
sonar.exclusions=**/*_test.go

# ...sino pruebas: estan en estas carpetas y se reconocen por el nombre
sonar.tests=cmd,internal
sonar.test.inclusions=**/*_test.go

# Resultado de: go test -coverprofile=coverage.out ./...
# SonarQube no corre las pruebas, solo lee este archivo
sonar.go.coverage.reportPaths=coverage.out
