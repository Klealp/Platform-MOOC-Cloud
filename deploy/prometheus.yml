# Prometheus raspa la API y los workers.
#
# Para los workers se usa dns_sd_configs y no una lista fija de direcciones:
# al escalar con `--scale worker=3`, Docker crea tres contenedores y el DNS
# interno devuelve las tres IPs bajo el mismo nombre. Con una lista estatica
# solo veriamos uno.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: mooc-api
    static_configs:
      - targets: ["api:8080"]

  - job_name: mooc-worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
