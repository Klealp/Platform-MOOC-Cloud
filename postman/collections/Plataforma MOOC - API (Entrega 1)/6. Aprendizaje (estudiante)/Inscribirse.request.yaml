$kind: http-request
url: "{{baseUrl}}/api/v1/enrollments"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "slug": "{{slug}}"
    }
scripts:
  - type: afterResponse
    code: |-
      const j=pm.response.json();
      pm.collectionVariables.set('enrollmentId', j.id);
    language: text/javascript
order: 1000
