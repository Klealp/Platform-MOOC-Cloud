$kind: http-request
url: "{{baseUrl}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{studentEmail}}",
      "full_name": "Estudiante Demo",
      "password": "{{studentPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('studentEmail','estudiante_'+Date.now()+'@mooc.local');
    language: text/javascript
  - type: afterResponse
    code: |-
      const j=pm.response.json();
      if(j.dev_verification_token){pm.collectionVariables.set('verifyToken', j.dev_verification_token);}
      pm.test('202', ()=>pm.expect(pm.response.code).to.eql(202));
    language: text/javascript
order: 2000
