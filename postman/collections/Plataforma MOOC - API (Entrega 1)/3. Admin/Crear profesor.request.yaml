$kind: http-request
description: Unica via para crear profesores. Luego usa 'Login (profesor)'.
url: "{{baseUrl}}/api/v1/admin/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{teacherEmail}}",
      "full_name": "Profesora Demo",
      "password": "{{teacherPassword}}",
      "role": "teacher"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('teacherEmail','profe_'+Date.now()+'@mooc.local');
    language: text/javascript
  - type: afterResponse
    code: pm.test('201', ()=>pm.expect(pm.response.code).to.be.oneOf([201,409]));
    language: text/javascript
order: 1000
